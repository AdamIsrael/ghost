# Ghost configuration. Docs: docs/superpowers/specs/2026-10-09-ghost-design.md

poll_interval = "5m"
max_concurrent_reviews = 2
max_daily_cost_usd = 10.0
max_cost_per_review_usd = 1.5

# "confirm": finished reviews wait in the TUI until you press P to post them.
# "auto": post as soon as a review finishes. Reviews that look like they
# contain a secret are never posted in either mode.
post_mode = "confirm"

# TUI colors: "auto" (match the terminal background), "dark", "light",
# "high-contrast" or "mono". Press t in the TUI to try them. NO_COLOR=1 forces mono.
theme = "auto"

default_agent = "claude"

[agents.claude]
kind = "claude"
model = "claude-opus-5-5"
extra_args = []
# The prompt that starts each review. Use `prompt = """..."""` inline or
# `prompt_file` (relative to this file, or ~/...). Template variables:
# {{.Repo}} {{.Number}} {{.Title}} {{.Author}} {{.Body}} {{.BaseRef}}
# {{.HeadRef}} {{.HeadSHA}} {{.URL}} {{.ChangedFiles}}
prompt_file = "prompts/default.md"

[auto_approve]
enabled = false
require_confirm = true
require_ci_green = true
# A PR with no CI checks at all is not "green" unless you set this.
no_checks_is_green = false
no_blocking_comments = true
no_changes_requested = true
max_changed_lines = 400

# Views (the PR searches Ghost polls) live in views.toml next to this file,
# so the TUI can edit them without touching your comments here. You can also
# add [[view]] tables to this file; those are read-only in the TUI.
