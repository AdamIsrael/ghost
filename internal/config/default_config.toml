# Ghost configuration. Docs: https://github.com/AdamIsrael/ghost#configuration

poll_interval = "5m"
max_concurrent_reviews = 2
max_daily_cost_usd = 10.0
max_cost_per_review_usd = 1.5

# "confirm": finished reviews wait in the TUI until you press P to post them.
# "auto": post as soon as a review finishes. Reviews that look like they
# contain a secret are never posted in either mode.
post_mode = "confirm"

# TUI colors: "auto" (match the terminal background), or one of dark, light,
# high-contrast, mono, tokyo-night, tokyo-night-storm, tokyo-night-day,
# catppuccin-mocha, catppuccin-latte, dracula, nord, gruvbox-dark,
# solarized-dark, solarized-light. Add your own as themes/<name>.toml next to
# this file. Press t in the TUI to try them. NO_COLOR=1 forces mono.
theme = "auto"

# Text added to GitHub posts. Both are off (empty) by default, so posts
# carry only the review itself. Go templates with {{.Agent}} {{.Model}}
# {{.Repo}} {{.Number}} {{.HeadSHA}} (7 characters).
# review_footer = "<sub>Automated review · agent `{{.Agent}}` · commit {{.HeadSHA}}</sub>"
# approval_message = "Approved by Ghost: no blocking issues found."

# Label PRs before reviewing them. When set, Ghost adds this label to a PR
# and reviews it on the next poll. Removing the label opts the PR out (add
# it back to resume). A view can override it with `label = "..."`, or turn
# it off with `label = ""`. Off when empty.
# review_label = "ai-review"

# How many PRs each view shows (1–100; GitHub returns at most 100 per
# search). A view can override it with `max_prs = ...` in views.toml.
# max_prs_per_view = 50

# Ghost logs errors in full, plus its actions (queued, posted, approved…), to
# ~/.local/state/ghost/ghost.log (or $XDG_STATE_HOME/ghost/ghost.log). The
# file is capped at 5 MB with one older copy (ghost.log.1).
# log_file = "~/logs/ghost.log"   # write it somewhere else
# log_file = ""                   # turn logging off

default_agent = "claude"

[agents.claude]
kind = "claude"
model = "claude-opus-5-5"
extra_args = []
# The prompt that starts each review. Use `prompt = """..."""` inline or
# `prompt_file` (relative to this file, or ~/...). Template variables:
# {{.Repo}} {{.Number}} {{.Title}} {{.Author}} {{.Body}} {{.BaseRef}}
# {{.HeadRef}} {{.HeadSHA}} {{.URL}} {{.ChangedFiles}}
prompt_file = "prompts/default.md"

[auto_approve]
enabled = false
require_confirm = true
require_ci_green = true
# A PR with no CI checks at all is not "green" unless you set this.
no_checks_is_green = false
no_blocking_comments = true
no_changes_requested = true
max_changed_lines = 400

# Views (the PR searches Ghost polls) live in views.toml next to this file,
# so the TUI can edit them without touching your comments here. You can also
# add [[view]] tables to this file; those are read-only in the TUI.
